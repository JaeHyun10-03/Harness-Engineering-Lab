lass="title">요청 분류</text><text x="500.0" y="219" text-anchor="middle" class="sub">무엇을 요청했는지 확인</text><path d="M330 196 H165 V270" class="line"/><path d="M670 196 H835 V270" class="line"/><rect x="35" y="270" width="260" height="120" rx="14" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="1.5"/><text x="165.0" y="305" text-anchor="middle" class="title">단순 질문</text><text x="165.0" y="334" text-anchor="middle" class="sub">관련 자료 읽기</text><text x="165.0" y="359" text-anchor="middle" class="sub">답변 후 종료</text><rect x="705" y="270" width="260" height="120" rx="14" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="1.5"/><text x="835.0" y="305" text-anchor="middle" class="title">리뷰만 요청</text><text x="835.0" y="334" text-anchor="middle" class="sub">관련 코드·기준 확인</text><text x="835.0" y="359" text-anchor="middle" class="sub">리뷰 결과 보고 후 종료</text><path d="M500 240 V435" class="line"/><text x="545" y="325" text-anchor="middle" class="label">개발 작업</text><path d="M500 435 H275 V475" class="line"/><path d="M500 435 H725 V475" class="line"/><rect x="105" y="475" width="340" height="125" rx="14" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="1.5"/><text x="275.0" y="510" text-anchor="middle" class="title">새 작업 · 계획</text><text x="275.0" y="539" text-anchor="middle" class="sub">관련 코드 확인 → task.md 작성</text><text x="275.0" y="564" text-anchor="middle" class="sub">목표·완료 기준 → verifier 확인</text><rect x="555" y="475" width="340" height="125" rx="14" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="1.5"/><text x="725.0" y="510" text-anchor="middle" class="title">기존 작업 · 현재 상태 확인</text><text x="725.0" y="539" text-anchor="middle" class="sub">task.md + progress.md 읽기</text><text x="725.0" y="564" text-anchor="middle" class="sub">실제 코드와 기록 대조</text><path d="M275 600 V655 H500 V715" class="line"/><path d="M725 600 V655 H500" fill="none" stroke="#64748b" stroke-width="2"/><text x="710" y="692" text-anchor="middle" class="label">계획·현재 상태 확인 후 진행</text><rect x="330" y="715" width="340" height="100" rx="14" fill 65 H670" class="retry"/><text x="842" y="955" text-anchor="middle" class="label">문제 발견</text><text x="842" y="983" text-anchor="middle" class="label">수정·재테스트</text><rect x="55" y="1500" width="890" height="66" rx="12" fill="#fff8ea"/><text x="500" y="1527" text-anchor="middle" class="sub">어느 단계든 선택이 필요하거나 실행이 막히면: 이유·재개 조건 기록 → 대기</text><text x="500" y="1552" text-anchor="middle" class="sub">해결 후 필요한 단계부터 재개합니다. 계획만 요청했다면 계획에서 종료합니다.</text></svg></main></html>
